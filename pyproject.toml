[project]
name = "free-web-search-mcp"
version = "0.1.0"
description = "MCP server that aggregates DuckDuckGo Instant Answer, Tavily, and Firecrawl into a unified free-first web-search surface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "free-web-search-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "duckduckgo", "tavily", "firecrawl", "search", "fastmcp", "aggregator"]
dependencies = [
    "fastmcp==4.0.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
free-web-search-mcp = "free_web_search_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/free_web_search_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
